<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iniciar sesión · NightClaw</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grain"></div>
<main class="auth-page">
<a class="logo" href="index.html"><span>THE</span>NIGHTCLAW</a>
<section class="auth-card">
<span class="eyebrow">ACCOUNT / 01</span>
<h1>Bienvenido<br><em>de nuevo.</em></h1>
<p class="auth-muted">Accede a tu cuenta de NightClaw.</p>
<div class="auth-divider"><span>continúa con email</span></div>
<form id="loginForm" novalidate>
<label>EMAIL<input id="email" name="email" type="email" autocomplete="email" placeholder="tu@email.com"></label>
<label>CONTRASEÑA<input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••"></label>
<a class="forgot" href="#">¿Has olvidado tu contraseña?</a>
<button class="button button-lime checkout-button" type="submit">Iniciar sesión ↗</button>
</form>
<p class="auth-footer">¿No tienes cuenta? <a href="login.html#signup">Crear cuenta</a></p>
<p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="analytics.js"></script>
<script src="auth.js"></script>
</body>
</html>
